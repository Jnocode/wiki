<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Jun's Wiki</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --accent2: #3fb950;
    --accent3: #d29922;
    --code-bg: #1c2128;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    min-height: 100vh;
  }
  .container { max-width: 800px; margin: 0 auto; padding: 2rem 1.5rem; }

  nav {
    margin-bottom: 2rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  nav a {
    color: var(--accent);
    text-decoration: none;
    font-size: 0.9rem;
  }
  nav a:hover { text-decoration: underline; }
  nav .sep { color: var(--text-dim); font-size: 0.8rem; }

  #content h1 {
    font-size: 1.8rem;
    font-weight: 700;
    margin: 1.5rem 0 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
  }
  #content h2 {
    font-size: 1.35rem;
    font-weight: 600;
    margin: 1.5rem 0 0.75rem;
    color: var(--accent2);
  }
  #content h3 {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 1.2rem 0 0.5rem;
    color: var(--accent);
  }
  #content p { margin: 0.5rem 0; }
  #content a { color: var(--accent); text-decoration: none; }
  #content a:hover { text-decoration: underline; }
  #content ul, #content ol { margin: 0.5rem 0; padding-left: 1.5rem; }
  #content li { margin: 0.25rem 0; }
  #content table {
    width: 100%;
    border-collapse: collapse;
    margin: 1rem 0;
    font-size: 0.9rem;
  }
  #content th, #content td {
    border: 1px solid var(--border);
    padding: 0.5rem 0.75rem;
    text-align: left;
  }
  #content th {
    background: var(--surface);
    color: var(--text-dim);
    font-weight: 600;
  }
  #content tr:nth-child(even) { background: #111820; }
  #content code {
    background: var(--code-bg);
    padding: 0.15rem 0.4rem;
    border-radius: 4px;
    font-size: 0.85rem;
    color: var(--accent3);
    font-family: 'Cascadia Code', 'Fira Code', monospace;
  }
  #content pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1rem;
    margin: 1rem 0;
    overflow-x: auto;
  }
  #content pre code {
    background: none;
    padding: 0;
    color: var(--text);
  }
  #content blockquote {
    border-left: 3px solid var(--accent);
    padding: 0.5rem 1rem;
    margin: 1rem 0;
    color: var(--text-dim);
    background: #111820;
    border-radius: 0 4px 4px 0;
  }
  #content hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 1.5rem 0;
  }
  #content strong { color: var(--accent3); }
  #content em { color: var(--purple); }
  #content img { max-width: 100%; border-radius: 6px; margin: 1rem 0; }
  #content .loading {
    text-align: center;
    padding: 3rem;
    color: var(--text-dim);
  }
  #content .error {
    text-align: center;
    padding: 3rem;
    color: #ff7b72;
  }
  footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    font-size: 0.85rem;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
<nav>
  <a href="./">← 回 Wiki 首頁</a>
  <span class="sep">/</span>
  <span id="navTitle" style="color:var(--text-dim);font-size:0.9rem;"></span>
</nav>
<div id="content"><div class="loading">載入中…</div></div>
<footer>
  <span><a href="https://github.com/Jnocode/wiki">Jnocode/wiki</a> · GitHub Pages</span>
  <span>Powered by ☕ &amp; Hermes</span>
</footer>
</div>
<script>
async function loadPage() {
  const params = new URLSearchParams(window.location.search);
  const file = params.get('file');
  if (!file) {
    document.getElementById('content').innerHTML = '<div class="error">❌ 未指定檔案</div>';
    return;
  }
  document.getElementById('navTitle').textContent = file;
  const title = file.split('/').pop().replace('.md','');
  document.getElementById('pageTitle').textContent = title + ' · Jun\'s Wiki';
  try {
    const res = await fetch(file);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const md = await res.text();
    const html = marked.parse(md);
    document.getElementById('content').innerHTML = html;
    // fix local file:// links — strip them
    document.querySelectorAll('#content a[href^="file://"]').forEach(a => {
      a.style.opacity = '0.4';
      a.title = '本機檔案（需在本機瀏覽）';
    });
  } catch (e) {
    document.getElementById('content').innerHTML =
      `<div class="error">❌ 載入失敗: ${e.message}</div>`;
  }
}
loadPage();
</script>
</body>
</html>
