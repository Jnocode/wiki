version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wiki-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wiki_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - wiki-net

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: wiki-search
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_KEY:-wiki_change_me_secret}
      MEILI_HTTP_ADDR: 0.0.0.0:7700
    volumes:
      - meili_data:/meili_data
    ports:
      - "7700:7700"
    networks:
      - wiki-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wiki-api
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      DATABASE_URL: postgresql+asyncpg://wiki:${DB_PASSWORD:-wiki_change_me}@postgres:5432/wiki
      MEILI_URL: http://meilisearch:7700
      MEILI_KEY: ${MEILI_KEY:-wiki_change_me_secret}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - meilisearch
    volumes:
      - /volume1/web/wiki:/wiki:ro
    networks:
      - wiki-net

volumes:
  postgres_data:
  meili_data:

networks:
  wiki-net:
