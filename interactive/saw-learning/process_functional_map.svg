<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 820" width="100%" height="100%" style="background:#161b22; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', sans-serif;">
  <style>
    .title { fill: #58a6ff; font-size: 26px; font-weight: bold; }
    .subtitle { fill: #8b949e; font-size: 20px; }
    .banner-bg { fill: #b62324; rx: 6px; }
    .banner-text { fill: #ffffff; font-size: 20px; font-weight: bold; text-anchor: middle; }
    .box-bg { fill: #0d1117; stroke: #30363d; stroke-width: 2px; rx: 10px; }
    .box-title { fill: #79c0ff; font-size: 22px; font-weight: bold; }
    .box-desc { fill: #c9d1d9; font-size: 20px; }
    .arrow { stroke: #58a6ff; stroke-width: 3; marker-end: url(#blue-arrow); fill: none; }
    .feedback-arrow { stroke: #d29922; stroke-width: 2.5; stroke-dasharray: 6,4; marker-end: url(#orange-arrow); fill: none; }
    .feedback-text { fill: #e3b341; font-size: 20px; }
    .note-text { fill: #8b949e; font-size: 20px; }
  </style>

  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d29922" />
    </marker>
  </defs>

  <!-- 標題區 -->
  <text x="25" y="42" class="title">SAW 封裝切割站：功能單元關係圖</text>
  <text x="25" y="72" class="subtitle">封裝切割核心功能架構與補償回饋（非單向現場SOP）</text>

  <!-- 警示橫幅 -->
  <rect x="25" y="90" width="530" height="36" class="banner-bg" />
  <text x="290" y="115" class="banner-text">【AI 整理示意／非機台實測／非缺陷判定標準】</text>

  <!-- 單元 1: 對位與路徑運算 -->
  <g transform="translate(25, 145)">
    <rect width="530" height="120" class="box-bg" stroke="#1f6feb" data-tooltip="對位與步進運算單元 (Alignment & Index)：光學鏡頭擷取導線架或基板特徵；角度旋轉校正與熱膨脹／翹曲補償計算。" />
    <circle cx="35" cy="35" r="16" fill="#1f6feb" />
    <text x="35" y="42" fill="#fff" font-size="20" font-weight="bold" text-anchor="middle">1</text>
    <text x="65" y="40" class="box-title">對位與步進運算單元 (Alignment &amp; Index)</text>
    <text x="35" y="75" class="box-desc">• 光學鏡頭擷取導線架或基板特徵 (Fiducial / Lead)</text>
    <text x="35" y="102" class="box-desc">• 角度旋轉校正 (θ) 與基板熱膨脹 / 翹曲補償計算</text>
  </g>

  <!-- 連接箭頭 1 -> 2 -->
  <path d="M 290 265 L 290 295" class="arrow" />

  <!-- 單元 2: 主軸切削 -->
  <g transform="translate(25, 300)">
    <rect width="530" height="120" class="box-bg" stroke="#238636" data-tooltip="高速刀軸切割單元 (Spindle & Dicing)：真空治具或膠帶固定封裝體；刀具旋轉切削＋冷卻水噴淋＋破刀檢知器 (BBD)。" />
    <circle cx="35" cy="35" r="16" fill="#238636" />
    <text x="35" y="42" fill="#fff" font-size="20" font-weight="bold" text-anchor="middle">2</text>
    <text x="65" y="40" class="box-title">高速刀軸切割單元 (Spindle &amp; Dicing)</text>
    <text x="35" y="75" class="box-desc">• 真空治具 (Jig Chuck) 或膠帶固定封裝體</text>
    <text x="35" y="102" class="box-desc">• 刀具旋轉切削＋冷卻水噴淋＋破刀檢知器 (BBD)</text>
  </g>

  <!-- 連接箭頭 2 -> 3 -->
  <path d="M 290 420 L 290 450" class="arrow" />

  <!-- 單元 3: 切痕檢驗與即時補償 -->
  <g transform="translate(25, 455)">
    <rect width="530" height="120" class="box-bg" stroke="#8957e5" data-tooltip="切痕檢驗單元 (Kerf Check & Feedback)：檢驗切痕寬度與切割中心偏位；監控刀具側面磨耗與異常破刃。" />
    <circle cx="35" cy="35" r="16" fill="#8957e5" />
    <text x="35" y="42" fill="#fff" font-size="20" font-weight="bold" text-anchor="middle">3</text>
    <text x="65" y="40" class="box-title">切痕檢驗單元 (Kerf Check &amp; Feedback)</text>
    <text x="35" y="75" class="box-desc">• 檢驗切痕寬度 (Kerf Width) 與切割中心偏位</text>
    <text x="35" y="102" class="box-desc">• 監控刀具側面磨耗 (Side Wear) 與異常破刃</text>
  </g>

  <!-- 連接箭頭 3 -> 4 -->
  <path d="M 290 575 L 290 605" class="arrow" />

  <!-- 單元 4: 清洗、收料與分選 -->
  <g transform="translate(25, 610)">
    <rect width="530" height="110" class="box-bg" stroke="#388bfd" data-tooltip="清洗分選收料單元 (Cleaning & Handler)：高壓水洗去毛屑、真空吸嘴取放至料盤；依良品／不良品分類收料。" />
    <circle cx="35" cy="35" r="16" fill="#388bfd" />
    <text x="35" y="42" fill="#fff" font-size="20" font-weight="bold" text-anchor="middle">4</text>
    <text x="65" y="40" class="box-title">清洗分選收料單元 (Cleaning &amp; Handler)</text>
    <text x="35" y="75" class="box-desc">• 高壓水洗去毛屑、真空吸嘴取放至料盤 (Tray)</text>
    <text x="35" y="98" class="box-desc">• 依良品/不良品分類收料 (Spinner / Dry)</text>
  </g>

  <!-- 回饋控制虛線：切痕補償至對位運算 -->
  <path d="M 520 515 C 560 515, 560 205, 520 205" class="feedback-arrow" />
  <text x="430" y="360" class="feedback-text">切痕偏移補償</text>

  <!-- 底部說明 -->
  <text x="25" y="760" class="note-text">※ 現場各站由手臂串聯，因果為動態閉環。</text>
  <text x="25" y="790" class="note-text">※ 對照卡重點：每個動作的「前置條件」與「完成證據」。</text>
</svg>
